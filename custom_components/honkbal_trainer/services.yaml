genereer_seizoen:
  name: Genereer seizoen
  description: Genereert of vernieuwt de trainingsplanning.
  fields:
    entry_id:
      name: Configuratie
      selector:
        config_entry:
voeg_drill_toe:
  name: Voeg drill toe
  description: Voegt een bestaande catalogusdrill toe aan een sessieblok.
  fields:
    session_uid:
      name: Sessie-ID
      required: true
      selector:
        text:
    block:
      name: Blok
      required: true
      selector:
        select:
          options:
            - label: Basisblok
              value: foundation
            - label: Thema 1
              value: theme_1
            - label: Thema 2
              value: theme_2
            - label: Afsluiting
              value: closing
    drill_id:
      name: Drill-ID
      required: true
      selector:
        text:
